<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320" viewBox="0 0 440 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e15;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1a25;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#0a1018;stop-opacity:0.4" />
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="25" />
    </filter>
  </defs>
  
  <rect width="440" height="320" fill="url(#bg)" rx="10"/>
  <circle cx="100" cy="80" r="60" fill="#00d4aa" opacity="0.04" filter="url(#blur1)"/>
  
  <!-- Glass panel -->
  <rect x="12" y="12" width="416" height="296" rx="8" fill="url(#glass)" stroke="#1a3040" stroke-width="1.5"/>
  
  <!-- Title bar -->
  <rect x="12" y="12" width="416" height="28" rx="8" fill="#0a1218" opacity="0.9"/>
  <rect x="12" y="32" width="416" height="8" fill="#0a1218" opacity="0.9"/>
  <text x="28" y="31" font-family="'Courier New', monospace" font-size="9" fill="#00d4aa" font-weight="bold">✦ PROJECT_01.exe</text>
  
  <!-- Window buttons -->
  <rect x="370" y="22" width="14" height="14" rx="2" fill="none" stroke="#2a4a5a" stroke-width="1"/>
  <text x="374" y="33" font-family="'Courier New', monospace" font-size="10" fill="#2a4a5a">−</text>
  <rect x="390" y="22" width="14" height="14" rx="2" fill="none" stroke="#2a4a5a" stroke-width="1"/>
  <rect x="410" y="22" width="14" height="14" rx="2" fill="none" stroke="#ff5f57" stroke-width="1"/>
  <text x="413" y="33" font-family="'Courier New', monospace" font-size="10" fill="#ff5f57">×</text>
  
  <!-- Category -->
  <text x="32" y="65" font-family="'Courier New', monospace" font-size="9" fill="#5a8a9a" font-weight="bold" letter-spacing="1">WEB · HACKATHON · COMMUNITY</text>
  
  <!-- Project name -->
  <text x="32" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="32" fill="#e0f0f8" font-weight="900" letter-spacing="-0.5">HACK-PACK</text>
  <text x="32" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#8ab0c8" font-weight="600">Website</text>
  
  <!-- Icon -->
  <text x="350" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="50" fill="#00d4aa" opacity="0.3">🏆</text>
  
  <!-- Description -->
  <text x="32" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8aa0b0">The ultimate resource hub for</text>
  <text x="32" y="188" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8aa0b0">hackathon enthusiasts.</text>
  <text x="32" y="210" font-family="'Courier New', monospace" font-size="11" fill="#5a7a8a">Guides, tools &amp; code templates.</text>
  
  <!-- Tech badges -->
  <rect x="32" y="235" width="58" height="24" rx="4" fill="none" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="43" y="251" font-family="'Courier New', monospace" font-size="10" fill="#00d4aa">HTML</text>
  <rect x="100" y="235" width="50" height="24" rx="4" fill="none" stroke="#00b4d8" stroke-width="1.5"/>
  <text x="113" y="251" font-family="'Courier New', monospace" font-size="10" fill="#00b4d8">CSS</text>
  <rect x="160" y="235" width="40" height="24" rx="4" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="172" y="251" font-family="'Courier New', monospace" font-size="10" fill="#7c3aed">JS</text>
  
  <!-- Bottom -->
  <line x1="32" y1="277" x2="408" y2="277" stroke="#1a2a3a" stroke-width="0.5"/>
  <text x="32" y="297" font-family="'Courier New', monospace" font-size="8" fill="#3a5a6a">WEB → COMMUNITY → HACKATHON</text>
  <text x="340" y="297" font-family="'Courier New', monospace" font-size="9" fill="#00d4aa" font-weight="bold">OPEN REPO ↗</text>
</svg>
