" cx="134" cy="50" r="7" fill="#2F5BFF" stroke="#000000" stroke-width="2"/><text class="stat" style="animation-delay:0s" x="262" y="50" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#000000">Building cool stuff</text><text class="stat s1" style="animation-delay:3s" x="262" y="50" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#000000">Fixing a tiny bug</text><text class="stat s2" style="animation-delay:6s" x="262" y="50" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#000000">Running on caffeine</text></g><g transform="rotate(5 910.0 117.0)"><g class="fx wig2" style="animation-delay:0s"><rect x="781" y="92" width="270" height="62" fill="#000000"/><rect x="775" y="86" width="270" height="62" fill="#2F5BFF" stroke="#000000" stroke-width="4"/><text x="910.0" y="117.0" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">@Visagan2007</text></g></g><g transform="rotate(-5 975.0 202.0)"><g class="fx bob" style="animation-delay:-1s"><rect x="906" y="182" width="150" height="52" fill="#000000"/><rect x="900" y="176" width="150" height="52" fill="#DBE4FF" stroke="#000000" stroke-width="4"/><text x="975.0" y="202.0" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#000000">he/him</text></g></g><g transform="rotate(0 229.5 300.0)"><g class="fx bob" style="animation-delay:0.0s"><rect x="117" y="285" width="235" height="40" fill="#000000"/><rect x="112" y="280" width="235" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><text x="229.5" y="300.0" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#000000">Hackathon tooling</text></g></g><g transform="rotate(0 451.5 300.0)"><g class="fx bob" style="animation-delay:-0.45s"><rect x="374" y="285" width="165" height="40" fill="#000000"/><rect x="369" y="280" width="165" height="40" fill="#E5E7EB" stroke="#000000" stroke-width="4"/><text x="451.5" y="300.0" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#000000">AI analysis</text></g></g><g transform="rotate(0 638.5 300.0)"><g class="fx bob" style="animation-delay:-0.9s"><rect x="561" y="285" width="165" height="40" fill="#000000"/><rect x="556" y="280" width="165" height="40" fill="#DBE4FF" stroke="#000000" stroke-width="4"/><text x="638.5" y="300.0" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#000000">Mobile apps</text></g></g><g transform="rotate(0 831.5 300.0)"><g class="fx bob" style="animation-delay:-1.35s"><rect x="748" y="285" width="177" height="40" fill="#000000"/><rect x="743" y="280" width="177" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="4"/><text x="831.5" y="300.0" dy=".35em" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#000000">Cryptography</text></g></g><rect x="4" y="4" width="1192" height="392" fill="none" stroke="#000000" stroke-width="8"/><polygon class="fx spin" points="1118.0,10.0 1127.8,25.3 1144.0,17.0 1144.9,35.1 1163.0,36.0 1154.7,52.2 1170.0,62.0 1154.7,71.8 1163.0,88.0 1144.9,88.9 1144.0,107.0 1127.8,98.7 1118.0,114.0 1108.2,98.7 1092.0,107.0 1091.1,88.9 1073.0,88.0 1081.3,71.8 1066.0,62.0 1081.3,52.2 1073.0,36.0 1091.1,35.1 1092.0,17.0 1108.2,25.3" fill="#FFFFFF" stroke="#000000" stroke-width="4" stroke-linejoin="round"/><g transform="rotate(12 1118 62)"><text class="fx wig2" x="1118" y="62" dy=".35em" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="900" fill="#000000">hi!</text></g>
</svg>
