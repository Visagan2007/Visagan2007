<svg xmlns="http://www.w3.org/2000/svg" width="900" height="100" viewBox="0 0 900 100" role="img">
<title>Connect</title>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.j{transform-box:fill-box;transform-origin:left bottom}
.s1,.s2{opacity:0}
@media (prefers-reduced-motion:no-preference){
.d1{animation:d1 11s ease-in-out infinite}
.d2{animation:d2 14s ease-in-out infinite}
.d3{animation:d3 9s ease-in-out infinite}
.wig{animation:wig 2.4s ease-in-out infinite}
.wig2{animation:wig 3.1s ease-in-out infinite reverse}
.bob{animation:bob 3s ease-in-out infinite}
.pop{animation:pop 1.6s ease-in-out infinite}
.spin{animation:spin 9s linear infinite}
.spinr{animation:spin 13s linear infinite reverse}
.jelly{animation:jelly 5s ease-in-out infinite}
.shad{animation:shad 4s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
.shine{animation:shine 5.5s ease-in-out infinite}
.stat{animation:stat 9s infinite}
.tape{animation:tape 1.2s linear infinite}
}
@keyframes d1{0%,100%{transform:translate(0,0)}33%{transform:translate(46px,-24px)}66%{transform:translate(-34px,22px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}40%{transform:translate(-50px,18px)}75%{transform:translate(30px,-26px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(36px,30px)}}
@keyframes wig{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes jelly{0%,55%,100%{transform:scale(1,1)}62%{transform:scale(1.05,.92)}69%{transform:scale(.97,1.06)}76%{transform:scale(1.02,.98)}83%{transform:scale(1,1)}}
@keyframes shad{0%,100%{transform:translate(0,0)}33%{transform:translate(5px,3px)}66%{transform:translate(-1px,5px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes shine{0%{transform:translateX(0)}55%,100%{transform:translateX(var(--w))}}
@keyframes stat{0%{opacity:0}3%{opacity:1}30%{opacity:1}33%{opacity:0}100%{opacity:0}}
@keyframes tape{to{transform:translateX(39.6px)}}
</style>
<defs><filter id="b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="36"/></filter><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".66"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient></defs>
<g class="d1" style="animation-delay:-0.0s"><circle cx="319" cy="48" r="60" fill="#8B5CF6" filter="url(#b)"/></g><g class="d2" style="animation-delay:-2.3s"><circle cx="584" cy="48" r="60" fill="#FF4D8D" filter="url(#b)"/></g><g class="d3" style="animation-delay:-4.6s"><circle cx="750" cy="48" r="60" fill="#22D3EE" filter="url(#b)"/></g><rect x="874" y="36" width="8" height="40" fill="#000000"/><rect x="261" y="68" width="613" height="8" fill="#000000"/><rect x="253" y="28" width="621" height="40" fill="url(#g)" stroke="#000000" stroke-width="4"/><rect x="261" y="36" width="605" height="24" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/><clipPath id="shs"><rect x="253" y="28" width="621" height="40"/></clipPath><g clip-path="url(#shs)"><polygon class="shine" style="--w:861px;animation-delay:2.0999999999999996s" points="163,28 223,28 193,68 133,68" fill="#fff" fill-opacity=".5"/></g><g transform="rotate(-1.5 118.5 45.0)"><g class="fx wig2" style="animation-delay:-3s"><rect x="22" y="22" width="209" height="62" fill="#000000"/><rect x="14" y="14" width="209" height="62" fill="#34F5B0" stroke="#000000" stroke-width="4"/><text x="118.5" y="45.0" dy=".35em" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="900" fill="#000000">Connect</text></g></g><polygon class="fx spin" points="852.0,24.0 856.9,32.8 866.1,28.6 864.9,38.6 874.8,40.6 868.0,48.0 874.8,55.4 864.9,57.4 866.1,67.4 856.9,63.2 852.0,72.0 847.1,63.2 837.9,67.4 839.1,57.4 829.2,55.4 836.0,48.0 829.2,40.6 839.1,38.6 837.9,28.6 847.1,32.8" fill="#FFE23D" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
</svg>
