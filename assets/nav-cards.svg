<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glass1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1a25;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0a1018;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="glass2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1825;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0a1218;stop-opacity:0.5" />
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30" />
    </filter>
  </defs>
  
  <rect width="900" height="340" fill="url(#bg)" rx="10"/>
  
  <!-- Ambient -->
  <circle cx="200" cy="170" r="100" fill="#00d4aa" opacity="0.04" filter="url(#blur1)"/>
  <circle cx="700" cy="170" r="100" fill="#7c3aed" opacity="0.04" filter="url(#blur1)"/>
  
  <!-- Section label -->
  <text x="30" y="30" font-family="'Courier New', monospace" font-size="10" fill="#00d4aa" letter-spacing="3" font-weight="bold">NAVIGATION.BAR / SECTIONS</text>
  
  <!-- Card 1: BUILD -->
  <rect x="30" y="50" width="265" height="260" rx="8" fill="url(#glass1)" stroke="#1a3040" stroke-width="1.5"/>
  <!-- Title bar -->
  <rect x="30" y="50" width="265" height="28" rx="8" fill="#0a1218" opacity="0.9"/>
  <rect x="30" y="70" width="265" height="8" fill="#0a1218" opacity="0.9"/>
  <text x="45" y="69" font-family="'Courier New', monospace" font-size="9" fill="#3a6a7a" font-weight="bold">✦ SECTION_01</text>
  <text x="260" y="69" font-family="'Courier New', monospace" font-size="8" fill="#2a4a5a">z1</text>
  
  <!-- Icon area -->
  <rect x="70" y="105" width="60" height="60" rx="30" fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.4"/>
  <text x="88" y="142" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#00d4aa">🏗️</text>
  
  <text x="55" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#e0f0f8" font-weight="900" text-anchor="start" letter-spacing="-0.5">BUILD</text>
  <text x="55" y="222" font-family="'Courier New', monospace" font-size="10" fill="#5a8a9a">Featured projects &amp;</text>
  <text x="55" y="236" font-family="'Courier New', monospace" font-size="10" fill="#5a8a9a">open-source work</text>
  
  <!-- Bottom accent -->
  <rect x="55" y="270" width="80" height="2" fill="#00d4aa" opacity="0.6" rx="1"/>
  <text x="55" y="295" font-family="'Courier New', monospace" font-size="8" fill="#2a5a6a">5 REPOSITORIES</text>

  <!-- Card 2: STACK -->
  <rect x="318" y="50" width="265" height="260" rx="8" fill="url(#glass2)" stroke="#1a3040" stroke-width="1.5"/>
  <rect x="318" y="50" width="265" height="28" rx="8" fill="#0a1218" opacity="0.9"/>
  <rect x="318" y="70" width="265" height="8" fill="#0a1218" opacity="0.9"/>
  <text x="333" y="69" font-family="'Courier New', monospace" font-size="9" fill="#3a6a7a" font-weight="bold">✦ SECTION_02</text>
  <text x="548" y="69" font-family="'Courier New', monospace" font-size="8" fill="#2a4a5a">z2</text>
  
  <rect x="358" y="105" width="60" height="60" rx="30" fill="none" stroke="#00b4d8" stroke-width="1.5" opacity="0.4"/>
  <text x="376" y="142" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#00b4d8">⚡</text>
  
  <text x="343" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#e0f0f8" font-weight="900" letter-spacing="-0.5">STACK</text>
  <text x="343" y="222" font-family="'Courier New', monospace" font-size="10" fill="#5a8a9a">Tech stack &amp; tools</text>
  <text x="343" y="236" font-family="'Courier New', monospace" font-size="10" fill="#5a8a9a">I build with daily</text>
  
  <rect x="343" y="270" width="80" height="2" fill="#00b4d8" opacity="0.6" rx="1"/>
  <text x="343" y="295" font-family="'Courier New', monospace" font-size="8" fill="#2a5a6a">6 LANGUAGES</text>
  
  <!-- Card 3: PULSE -->
  <rect x="606" y="50" width="265" height="260" rx="8" fill="url(#glass1)" stroke="#1a3040" stroke-width="1.5"/>
  <rect x="606" y="50" width="265" height="28" rx="8" fill="#0a1218" opacity="0.9"/>
  <rect x="606" y="70" width="265" height="8" fill="#0a1218" opacity="0.9"/>
  <text x="621" y="69" font-family="'Courier New', monospace" font-size="9" fill="#3a6a7a" font-weight="bold">✦ SECTION_03</text>
  <text x="836" y="69" font-family="'Courier New', monospace" font-size="8" fill="#2a4a5a">z3</text>
  
  <rect x="646" y="105" width="60" height="60" rx="30" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
  <text x="664" y="142" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#7c3aed">📡</text>
  
  <text x="631" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#e0f0f8" font-weight="900" letter-spacing="-0.5">PULSE</text>
  <text x="631" y="222" font-family="'Courier New', monospace" font-size="10" fill="#5a8a9a">GitHub activity &amp;</text>
  <text x="631" y="236" font-family="'Courier New', monospace" font-size="10" fill="#5a8a9a">contribution stats</text>
  
  <rect x="631" y="270" width="80" height="2" fill="#7c3aed" opacity="0.6" rx="1"/>
  <text x="631" y="295" font-family="'Courier New', monospace" font-size="8" fill="#2a5a6a">75+ CONTRIBUTIONS</text>
</svg>
